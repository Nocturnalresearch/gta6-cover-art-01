<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover art maker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23ff2e88'/%3E%3Ctext x='32' y='44' font-family='Arial Black, sans-serif' font-size='34' font-weight='900' fill='white' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover editor">
    <h1>Vice Cover Studio</h1>
    <p class="tagline">Turn a photo and a caption into a Vice City poster cover. Your photos never leave this machine.</p>

    <label class="field">Photos
      <input id="upload" type="file" accept="image/*" multiple>
      <span class="hint">Pick your own photos, or use the two samples below.</span>
    </label>
    <div id="photo-list" class="thumbs" aria-label="Photos to use"></div>

    <div class="field">
      <span class="label">Layout</span>
      <div id="layout-row" class="choices" role="group" aria-label="Panel layout"></div>
    </div>

    <div class="field">
      <span class="label">Panel</span>
      <div id="panel-list" class="choices" role="group" aria-label="Pick a panel to edit"></div>
      <label class="slider">Zoom <span id="zoom-val">100%</span>
        <input id="zoom" type="range" min="0.5" max="2.5" step="0.05" value="1">
      </label>
      <label class="slider">Pan left–right <span id="pan-x-val">0.00</span>
        <input id="pan-x" type="range" min="-1" max="1" step="0.01" value="0">
      </label>
      <label class="slider">Pan up–down <span id="pan-y-val">0.00</span>
        <input id="pan-y" type="range" min="-1" max="1" step="0.01" value="0">
      </label>
      <span class="hint">Or drag the photo right on the cover.</span>
    </div>

    <label class="field">Caption
      <input id="caption" type="text" maxlength="40" value="VICE CITY">
    </label>
    <label class="field">Subtitle
      <input id="subtitle" type="text" maxlength="60" value="SUNSET HEIST">
    </label>

    <label class="field">Sunset grade <span id="grade-val">70%</span>
      <input id="grade" type="range" min="0" max="100" step="1" value="70">
    </label>

    <div class="field">
      <span class="label">Post size</span>
      <div id="size-row" class="choices" role="group" aria-label="Export size"></div>
    </div>

    <button id="export" type="button">Export PNG</button>
    <p id="status" role="status"></p>
  </section>

  <section class="preview-wrap" aria-label="Live preview">
    <canvas id="preview" width="1080" height="608" aria-label="The cover, live preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
